services:
  postgres:
    image: postgres:17
    container_name: music-sync-postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - ./data/postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $${POSTGRES_USER:-music_sync} -d $${POSTGRES_DB:-music_sync}'
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ghcr.io/janisadhi/music-sync-backend:latest
    container_name: music-sync-app
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - METADATA_SERVICE_URL=${METADATA_SERVICE_URL:-http://metadata:8001}
      - RESILIO_HOST=${RESILIO_HOST:-resilio}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./data/downloads:/app/downloads

  metadata:
    image: ghcr.io/janisadhi/music-sync-metadata:latest
    container_name: music-sync-metadata
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data/downloads:/app/downloads
      - ./data/beets:/app/data/beets

  resilio:
    image: resilio/sync:latest
    container_name: music-sync-resilio
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /etc/resilio/sync.conf ]; then
          mkdir -p /etc/resilio
          cat > /etc/resilio/sync.conf << 'EOF'
        {
          "device_name": "Music-Sync",
          "listening_port": 55555,
          "storage_path": "/var/nobody",
          "use_upnp": false,
          "download_limit": 0,
          "upload_limit": 0,
          "directory_root": "/app/downloads",
          "directory_root_policy": "all",
          "webui": {
            "listen": "0.0.0.0:8888",
            "login": "admin",
            "password": "admin",
            "allow_empty_password": false
          }
        }
        EOF
        fi
        exec rslsync --nodaemon --config /etc/resilio/sync.conf
    env_file:
      - .env
    ports:
      - "55555:55555/tcp"
      - "55555:55555/udp"
    volumes:
      - ./data/resilio/config:/etc/resilio
      - ./data/resilio/storage:/var/nobody
      - ./data/downloads:/app/downloads

  dashboard:
    image: ghcr.io/janisadhi/music-sync-frontend:latest
    container_name: music-sync-dashboard
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:3000:80"

    depends_on:
      - app
      - metadata
      - resilio