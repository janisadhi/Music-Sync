name: Continuous Deployment

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    branches: [ main ]
    types:
      - completed
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build & Push Docker Images to GHCR
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push GHCR Docker Images
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Backend
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/music-sync-backend
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract metadata (tags, labels) for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/music-sync-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

      - name: Extract metadata (tags, labels) for Metadata Service
        id: meta-metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/music-sync-metadata
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}

      - name: Build and push Metadata Service Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./metadata_service/Dockerfile
          push: true
          tags: ${{ steps.meta-metadata.outputs.tags }}
          labels: ${{ steps.meta-metadata.outputs.labels }}

  # ---------------------------------------------------------------------------
  # 2. Deploy to Production Server via SSH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail

            DEPLOY_DIR="${{ secrets.DEPLOY_PATH != '' && secrets.DEPLOY_PATH || '/home/opc/mmusic' }}"
            cd "$DEPLOY_DIR"

            echo "=========================================="
            echo " Deploying Music Sync — $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "=========================================="

            # Log in to GHCR if token is provided (required for private packages)
            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            else
              echo "GHCR_TOKEN not set — skipping login (public packages only)"
            fi

            # Pull the latest images
            echo "Pulling latest images..."
            docker compose pull app metadata dashboard

            # Recreate only the services that changed
            echo "Recreating containers..."
            docker compose up -d --remove-orphans app metadata dashboard

            # Wait for backend health
            echo "Waiting for backend health..."
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
                echo "Backend is healthy!"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "WARNING: Backend health check timed out after 30s"
                docker compose logs --tail=50 app
                exit 1
              fi
              sleep 1
            done

            # Clean up old images
            echo "Pruning dangling images..."
            docker image prune -f

            echo "=========================================="
            echo " Deployment complete!"
            echo "=========================================="
            docker compose ps

      - name: Notify deployment status
        if: failure()
        run: |
          echo "::error::Deployment to production failed! Check the SSH step logs above."
