name: Continuous Integration

on:
  push:
    branches: [ main, devops, "feature/**" ]
  pull_request:
    branches: [ main, devops ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend Service CI (Python 3.14 + FastAPI + pytest)
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Python / FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Backend Unit & Integration Tests
        run: |
          pytest app/

      - name: Build Backend Docker Image
        run: |
          docker build -t music-sync-app:ci .

  # ---------------------------------------------------------------------------
  # 2. Frontend Dashboard CI (React 19 + Vite + Nginx)
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (React 19 / Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vite Production Bundle
        run: npm run build

      - name: Build Dashboard Docker Image
        run: |
          docker build -t music-sync-dashboard:ci .

  # ---------------------------------------------------------------------------
  # 3. Metadata Service CI (Python 3.14 + Beets + MusicBrainz)
  # ---------------------------------------------------------------------------
  metadata-ci:
    name: Metadata Service CI (Python / Beets)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Metadata dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r metadata_service/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Metadata Service Tests
        run: |
          pytest metadata_service/tests

      - name: Build Metadata Service Docker Image
        run: |
          docker build -t music-sync-metadata:ci metadata_service/

  # ---------------------------------------------------------------------------
  # 4. Docker Compose Stack Validation
  # ---------------------------------------------------------------------------
  docker-compose-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, metadata-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose -f docker-compose.yml config --quiet

      - name: Validate docker-compose-cd.yaml
        run: |
          docker compose -f docker-compose-cd.yaml config --quiet
