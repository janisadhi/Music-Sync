<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="1400" height="950" style="background:#11111b; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad-client" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="grad-backend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="grad-node" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#89b4fa"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a6e3a1"/>
    </marker>
    <marker id="arrow-peach" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fab387"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 22px; font-weight: 700; fill: #cdd6f4; }
    .subtitle { font-size: 13px; font-weight: 500; fill: #a6adc8; }
    .group-title { font-size: 14px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    .node-title { font-size: 13px; font-weight: 600; fill: #cdd6f4; }
    .node-sub { font-size: 11px; fill: #bac2de; }
    .edge-label { font-size: 11px; font-weight: 500; fill: #89b4fa; }
    .link { stroke: #45475a; stroke-width: 2; fill: none; }
    .link-active { stroke: #89b4fa; stroke-width: 2; fill: none; stroke-dasharray: 4,4; }
  </style>

  <!-- Title Header -->
  <text x="50" y="45" class="title">Music Sync — Architecture Diagram</text>
  <text x="50" y="68" class="subtitle">Decoupled Microservice Pipeline (Sync Discovers → Downloader Downloads → Lyrics Fetches)</text>

  <!-- 1. Client Layer -->
  <g filter="url(#shadow)">
    <rect x="50" y="100" width="380" height="240" rx="12" fill="url(#grad-client)" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="70" y="130" class="group-title" fill="#89b4fa">Client Layer (React 19 / Nginx)</text>
    
    <!-- Nodes -->
    <rect x="70" y="150" width="340" height="48" rx="8" fill="url(#grad-node)" stroke="#45475a"/>
    <text x="85" y="170" class="node-title">React 19 Web Dashboard</text>
    <text x="85" y="186" class="node-sub">SPA, Audio Player, Lyric Sync, Live Settings Controls</text>

    <rect x="70" y="215" width="340" height="48" rx="8" fill="url(#grad-node)" stroke="#45475a"/>
    <text x="85" y="235" class="node-title">ProtectedRoute &amp; Auth Views</text>
    <text x="85" y="251" class="node-sub">Login, Change Password, Token Storage</text>

    <rect x="70" y="278" width="340" height="48" rx="8" fill="url(#grad-node)" stroke="#45475a"/>
    <text x="85" y="298" class="node-title">Axios API Client</text>
    <text x="85" y="314" class="node-sub">JWT Bearer Token Interceptor &amp; Error Handling</text>
  </g>

  <!-- 2. Backend & Core Layer -->
  <g filter="url(#shadow)">
    <rect x="470" y="100" width="460" height="240" rx="12" fill="url(#grad-client)" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="490" y="130" class="group-title" fill="#f9e2af">API &amp; Core Layer (FastAPI / Uvicorn)</text>

    <rect x="490" y="150" width="420" height="48" rx="8" fill="url(#grad-node)" stroke="#45475a"/>
    <text x="505" y="170" class="node-title">FastAPI REST Endpoints (/songs, /playlists, /settings)</text>
    <text x="505" y="186" class="node-sub">Routing, Request Validation, Audio/Lyric Streaming</text>

    <rect x="490" y="215" width="200" height="48" rx="8" fill="url(#grad-node)" stroke="#45475a"/>
    <text x="505" y="235" class="node-title">JWT Auth &amp; Security</text>
    <text x="505" y="251" class="node-sub">PBKDF2 Password Hashing</text>

    <rect x="710" y="215" width="200" height="48" rx="8" fill="url(#grad-node)" stroke="#45475a"/>
    <text x="725" y="235" class="node-title">APScheduler Engine</text>
    <text x="725" y="251" class="node-sub">Periodic Auto-Sync Trigger</text>

    <rect x="490" y="278" width="420" height="48" rx="8" fill="url(#grad-node)" stroke="#45475a"/>
    <text x="505" y="298" class="node-title">Core YTDLP &amp; Cookie Context Manager (app.core.ytdlp)</text>
    <text x="505" y="314" class="node-sub">Deno JS Solver Config &amp; Secure Netscape Cookie Tempfile Lifecycle</text>
  </g>

  <!-- 3. Workers & Pipeline -->
  <g filter="url(#shadow)">
    <rect x="50" y="380" width="880" height="260" rx="12" fill="url(#grad-client)" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="70" y="410" class="group-title" fill="#a6e3a1">Sync &amp; Download Workers Pipeline</text>

    <!-- Worker 1: Watcher -->
    <rect x="70" y="430" width="260" height="85" rx="8" fill="url(#grad-node)" stroke="#a6e3a1"/>
    <text x="85" y="455" class="node-title" fill="#a6e3a1">1. YouTube Watcher</text>
    <text x="85" y="475" class="node-sub">Fast Flat Scraping Only</text>
    <text x="85" y="493" class="node-sub">(Whole / Last N Watch Modes)</text>

    <!-- Reconciler -->
    <rect x="70" y="535" width="260" height="85" rx="8" fill="url(#grad-node)" stroke="#45475a"/>
    <text x="85" y="560" class="node-title">2. Playlist Reconciler</text>
    <text x="85" y="580" class="node-sub">Diffs YouTube vs DB</text>
    <text x="85" y="598" class="node-sub">Queues missing songs as 'pending'</text>

    <!-- Worker 2: Downloader -->
    <rect x="360" y="430" width="260" height="190" rx="8" fill="url(#grad-node)" stroke="#a6e3a1"/>
    <text x="375" y="455" class="node-title" fill="#a6e3a1">3. Song Downloader Engine</text>
    <text x="375" y="475" class="node-sub">• Polls 'pending' queue</text>
    <text x="375" y="495" class="node-sub">• yt-dlp + Deno 2.9+ JS Solver</text>
    <text x="375" y="515" class="node-sub">• Secure Cookie Context Manager</text>
    <text x="375" y="535" class="node-sub">• FFmpeg Opus Transcoding</text>
    <text x="375" y="555" class="node-sub">• Embeds Artwork &amp; Metadata Tags</text>
    <text x="375" y="575" class="node-sub">• Exponential Backoff Retry Policy</text>

    <!-- Worker 3: Lyrics -->
    <rect x="650" y="430" width="260" height="190" rx="8" fill="url(#grad-node)" stroke="#a6e3a1"/>
    <text x="665" y="455" class="node-title" fill="#a6e3a1">4. Lyrics Worker Service</text>
    <text x="665" y="475" class="node-sub">• Scans downloaded songs</text>
    <text x="665" y="495" class="node-sub">• Queries LRCLIB API</text>
    <text x="665" y="515" class="node-sub">• Matches Title &amp; Artist</text>
    <text x="665" y="535" class="node-sub">• Writes .lrc synced lyrics</text>
    <text x="665" y="555" class="node-sub">• Fallback to 'no-lyrics/' folder</text>
  </g>

  <!-- 4. Persistence Layer -->
  <g filter="url(#shadow)">
    <rect x="970" y="100" width="380" height="240" rx="12" fill="url(#grad-client)" stroke="#fab387" stroke-width="1.5"/>
    <text x="990" y="130" class="group-title" fill="#fab387">Persistence Layer</text>

    <rect x="990" y="150" width="340" height="100" rx="8" fill="url(#grad-node)" stroke="#fab387"/>
    <text x="1005" y="175" class="node-title" fill="#fab387">PostgreSQL 17 Database</text>
    <text x="1005" y="195" class="node-sub">• Playlists &amp; Song Metadata</text>
    <text x="1005" y="213" class="node-sub">• Download Queue &amp; Retry States</text>
    <text x="1005" y="231" class="node-sub">• App Settings &amp; YouTube Cookies</text>

    <rect x="990" y="268" width="340" height="55" rx="8" fill="url(#grad-node)" stroke="#45475a"/>
    <text x="1005" y="293" class="node-title">Alembic Database Migrations</text>
    <text x="1005" y="309" class="node-sub">Automatic DDL Schema Upgrades</text>
  </g>

  <!-- 5. Local Storage Mounts -->
  <g filter="url(#shadow)">
    <rect x="970" y="380" width="380" height="260" rx="12" fill="url(#grad-client)" stroke="#94e2d5" stroke-width="1.5"/>
    <text x="990" y="410" class="group-title" fill="#94e2d5">Local Storage (Docker Mounts)</text>

    <rect x="990" y="430" width="340" height="90" rx="8" fill="url(#grad-node)" stroke="#94e2d5"/>
    <text x="1005" y="455" class="node-title" fill="#94e2d5">data/downloads/&lt;Playlist_Name&gt;/music/</text>
    <text x="1005" y="475" class="node-sub">High-Fidelity Opus (.opus) Audio Files</text>
    <text x="1005" y="495" class="node-sub">Embedded Cover Art &amp; ID3 Tags</text>

    <rect x="990" y="535" width="340" height="85" rx="8" fill="url(#grad-node)" stroke="#94e2d5"/>
    <text x="1005" y="560" class="node-title" fill="#94e2d5">data/downloads/&lt;Playlist_Name&gt;/no-lyrics/</text>
    <text x="1005" y="580" class="node-sub">Synchronized .lrc Lyrics Files</text>
    <text x="1005" y="598" class="node-sub">Tracks without lyrics fallback store</text>
  </g>

  <!-- 6. External Web Services -->
  <g filter="url(#shadow)">
    <rect x="50" y="680" width="1300" height="220" rx="12" fill="url(#grad-client)" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="70" y="710" class="group-title" fill="#f38ba8">External Web Services</text>

    <rect x="70" y="730" width="600" height="140" rx="8" fill="url(#grad-node)" stroke="#f38ba8"/>
    <text x="85" y="755" class="node-title" fill="#f38ba8">YouTube Music / YouTube Video Platform</text>
    <text x="85" y="775" class="node-sub">• Flat Playlist Scanning via Watcher</text>
    <text x="85" y="795" class="node-sub">• Deno 2.9+ JavaScript Challenge Solving for Stream Extraction</text>
    <text x="85" y="815" class="node-sub">• Netscape HTTP Cookie Authentication (Private &amp; Member Playlists)</text>
    <text x="85" y="835" class="node-sub">• Opus Audio Stream Download</text>

    <rect x="710" y="730" width="620" height="140" rx="8" fill="url(#grad-node)" stroke="#f38ba8"/>
    <text x="725" y="755" class="node-title" fill="#f38ba8">LRCLIB API Services</text>
    <text x="725" y="775" class="node-sub">• Synchronized Lyrics Database (.lrc)</text>
    <text x="725" y="795" class="node-sub">• Title &amp; Artist Fuzzy Metadata Search</text>
    <text x="725" y="815" class="node-sub">• Exact Duration Timestamp Matching</text>
  </g>

  <!-- Connectors -->
  <!-- Client to Backend -->
  <path d="M 430 220 L 470 220" class="link" marker-end="url(#arrow)"/>
  <text x="435" y="210" class="edge-label">REST API</text>

  <!-- Core to DB -->
  <path d="M 930 180 L 970 180" class="link" marker-end="url(#arrow)"/>

  <!-- Core to Workers -->
  <path d="M 700 340 L 700 380" class="link" marker-end="url(#arrow)"/>

  <!-- Watcher to Reconciler -->
  <path d="M 200 515 L 200 535" class="link" marker-end="url(#arrow-green)"/>

  <!-- Reconciler to DB -->
  <path d="M 330 580 L 990 240" class="link-active" marker-end="url(#arrow-peach)"/>

  <!-- Downloader to Storage -->
  <path d="M 620 500 L 990 475" class="link" marker-end="url(#arrow-green)"/>

  <!-- Lyrics to Storage -->
  <path d="M 910 560 L 990 560" class="link" marker-end="url(#arrow-green)"/>

  <!-- Watcher to YouTube -->
  <path d="M 200 625 L 200 730" class="link" marker-end="url(#arrow)"/>

  <!-- Downloader to YouTube -->
  <path d="M 490 625 L 490 730" class="link" marker-end="url(#arrow)"/>

  <!-- Lyrics to LRCLIB -->
  <path d="M 780 625 L 780 730" class="link" marker-end="url(#arrow)"/>

</svg>
