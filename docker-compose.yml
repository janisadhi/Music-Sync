services:

  postgres:
    image: postgres:17
    container_name: music-sync-postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - ./data/postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER:-music_sync} -d $${POSTGRES_DB:-music_sync}
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: music-sync-app
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./data/downloads:/app/downloads

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}

    container_name: music-sync-dashboard
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:3000:80"

    depends_on:
      - app