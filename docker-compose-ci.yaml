services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: music-sync-app
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./data/downloads:/app/downloads

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}

    container_name: music-sync-dashboard
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:3000:80"

    depends_on:
      - app